name: FarmerPlots
version: 1.0.0
main: com.zkxen.farmerplots.FarmerPlots
api-version: 1.20
authors:
  - zkxen
description: "\U0001F6F8 PROJECT OVERLORD - Enterprise-Grade Plot Management System"
website: https://github.com/zkxen/FarmerPlots

depend:
  - Multiverse-Core
  - PlaceholderAPI

softdepend: []

commands:
  plot:
    description: Plot management commands
    usage: /plot <help|claim|home|trust|untrust|info|gui|unclaim>
    aliases: [p]

  leaderboard:
    description: View top farmers
    usage: /leaderboard [blocks|gens|age]
    aliases: [lb]

  plotsadmin:
    description: Administrator commands
    usage: /plotsadmin <forcecreateplots|nukepending|nukeconfirm|nukeexecute>
    aliases: [pa]

permissions:
  farmerplots.use:
    description: Use basic plot commands
    default: true

  farmerplots.admin:
    description: Use admin commands
    default: op
